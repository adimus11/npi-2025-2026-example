services:
  # Notes server with ephemeral storage
  notes-ephemeral:
    build: .
    ports:
      - "8080:8080"
    environment:
      - STORAGE_BACKEND=ephemeral
      - PORT=8080

  # Notes server with Redis storage
  notes-redis:
    build: .
    ports:
      - "8081:8080"
    environment:
      - STORAGE_BACKEND=redis
      - REDIS_ADDR=redis:6379
      - PORT=8080
    depends_on:
      - redis

  # Notes server with Postgres storage
  notes-postgres:
    build: .
    ports:
      - "8082:8080"
    environment:
      - STORAGE_BACKEND=postgres
      - POSTGRES_CONN=host=postgres port=5432 user=postgres password=postgres dbname=notes sslmode=disable
      - PORT=8080
    depends_on:
      - postgres

  # Redis service
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Postgres service
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notes
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
